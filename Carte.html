<style>
  body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
  a { color: var(--color-accent-700); text-underline-offset: 3px; }
  a:hover { color: var(--color-accent-800); }
  .wrap { max-width: 1140px; margin: 0 auto; padding: 0 40px 80px; }
  #map { width: 100%; border-radius: 34px; background: var(--color-surface); box-shadow: var(--shadow-sm); overflow: hidden; }
  #map svg { display: block; width: 100%; height: auto; cursor: grab; touch-action: none; }
  #map svg:active { cursor: grabbing; }
  .zbtn { width: 40px; height: 40px; padding: 0; font-size: 18px; background: var(--color-bg); box-shadow: var(--shadow-sm); }
  @media (max-width: 720px) { .wrap { padding: 0 16px 60px; } header.nav { padding: 14px 16px !important; } h1 { font-size: 34px !important; } #lore { padding: 20px 18px !important; } }
  .dot { cursor: pointer; }
  .country { cursor: pointer; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 18px; }
  .chip {
    cursor: pointer; border: 1px solid var(--color-divider); background: transparent;
    font-family: var(--font-heading); font-size: 14px; color: var(--color-text);
    padding: 8px 16px; border-radius: 999px; white-space: nowrap;
  }
  .chip:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
  .chip[aria-pressed="true"] { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-bg); }
  .tip {
    position: fixed; pointer-events: none; opacity: 0; transition: opacity .12s ease;
    background: var(--color-neutral-900); color: var(--color-neutral-100);
    padding: 10px 14px; border-radius: 18px; box-shadow: var(--shadow-lg);
    font-size: 13px; line-height: 1.4; max-width: 240px; z-index: 10;
  }
  .tip b { font-family: var(--font-heading); font-weight: 400; font-size: 15px; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 22px; }
  .legend span { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; white-space: nowrap; }
  .legend i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--color-divider); }
</style>

<body>

<header class="nav" style="padding: 22px 40px; gap: 14px; max-width: 1140px; margin: 0 auto;">
  <a class="nav-brand" href="Site%20The.dc.html" style="font-size: 21px; white-space: nowrap; text-decoration: none; color: var(--color-text); display: inline-flex; align-items: center; gap: 10px;"><img src="logo-mark.png" alt="" width="40" height="40" style="display: block;">Maison du Thé</a>
  <a class="btn btn-secondary" href="Site The.dc.html" style="white-space: nowrap;">← Retour au site</a>
</header>

<main class="wrap">
  <div style="max-width: 680px; margin-bottom: 20px;">
    <h1 style="font-size: 46px; margin: 0 0 12px;">Carte des origines</h1>
    <p style="font-size: 17px; opacity: .72; margin: 0; text-wrap: pretty;">Chaque région est colorée selon le thé qu'elle produit surtout ; les pastilles indiquent toutes les familles présentes. Faites glisser pour vous déplacer, la molette ou le pincement pour zoomer, et cliquez sur une région pour le détail.</p>
  </div>
  <div class="controls" id="legend" aria-label="Filtrer par famille"></div>
  <div id="map" style="position: relative;">
    <div style="position: absolute; right: 14px; top: 14px; display: flex; flex-direction: column; gap: 6px; z-index: 2;">
      <button class="chip zbtn" id="zin" aria-label="Zoomer">+</button>
      <button class="chip zbtn" id="zout" aria-label="Dézoomer">−</button>
      <button class="chip zbtn" id="zreset" aria-label="Recentrer">⟲</button>
    </div>
  </div>
  <section id="lore" style="margin-top: 22px; background: var(--color-surface); border-radius: 34px; padding: 28px 30px; display: flex; flex-direction: column; gap: 14px;"></section>
</main>

<div class="tip" id="tip"></div>

<script>
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const FAMILIES = {
  blanc:  { label: 'Blanc',        color: css('--color-neutral-100') },
  vert:   { label: 'Vert',         color: css('--color-accent-2-400') },
  jaune:  { label: 'Jaune',        color: css('--color-accent-300') },
  oolong: { label: 'Oolong (bleu)',color: '#5f7f99' },
  noir:   { label: 'Noir (rouge)', color: '#9e3b2e' },
  sombre: { label: 'Sombre',       color: css('--color-accent-800') },
  aromatise: { label: 'Aromatisé', color: '#8b6aa7' },
  tisane: { label: 'Tisane', color: '#b98a3e' },
  rooibos: { label: 'Rooibos', color: '#b5452b' },
  mate: { label: 'Maté', color: '#6f7d3a' }
};

const TEAS = [
  { f: 'blanc',  i: 0, name: 'Bai Hao Yin Zhen',        origin: 'Fuding, Fujian, Chine',     c: 'China', p: 'Fujian', lat: 27.33, lon: 119.99 },
  { f: 'blanc',  i: 1, name: 'Bai Mu Dan',              origin: 'Zhenghe, Fujian, Chine',    c: 'China', p: 'Fujian', lat: 27.37, lon: 118.85 },
  { f: 'blanc',  i: 2, name: 'Shou Mei',                origin: 'Fujian, Chine',             c: 'China', p: 'Fujian', lat: 26.20, lon: 117.60 },
  { f: 'vert',   i: 0, name: 'Long Jing',               origin: 'Hangzhou, Zhejiang, Chine', c: 'China', p: 'Zhejiang', lat: 30.23, lon: 120.09 },
  { f: 'vert',   i: 1, name: 'Sencha',                  origin: 'Shizuoka, Japon',    c: 'Japan', p: 'Shizuoka', lat: 34.98, lon: 138.38 },
  { f: 'vert',   i: 2, name: 'Gyokuro',                 origin: 'Uji, Japon',         c: 'Japan', p: 'Kyoto', lat: 34.88, lon: 135.80 },
  { f: 'jaune',  i: 0, name: 'Jun Shan Yin Zhen',       origin: 'Hunan, Chine',              c: 'China', p: 'Hunan', lat: 29.35, lon: 113.05 },
  { f: 'jaune',  i: 1, name: 'Meng Ding Huang Ya',      origin: 'Sichuan, Chine',            c: 'China', p: 'Sichuan', lat: 30.08, lon: 103.12 },
  { f: 'jaune',  i: 2, name: 'Huoshan Huang Ya',        origin: 'Anhui, Chine',              c: 'China', p: 'Anhui', lat: 31.40, lon: 116.33 },
  { f: 'oolong', i: 0, name: 'Tie Guan Yin',            origin: 'Anxi, Fujian, Chine',       c: 'China', p: 'Fujian', lat: 25.06, lon: 118.19 },
  { f: 'oolong', i: 1, name: 'Da Hong Pao',             origin: 'Monts Wuyi, Fujian, Chine', c: 'China', p: 'Fujian', lat: 27.72, lon: 117.97 },
  { f: 'oolong', i: 2, name: 'Dong Ding',               origin: 'Nantou, Taïwan',     c: 'Taiwan', p: 'Taiwan', lat: 23.73, lon: 120.75 },
  { f: 'noir',   i: 0, name: 'Golden Assam',            origin: 'Assam, Inde',        c: 'India',     lat: 26.74, lon: 94.21 },
  { f: 'noir',   i: 1, name: 'Darjeeling second flush', origin: 'Darjeeling, Inde',   c: 'India',     lat: 27.04, lon: 88.26 },
  { f: 'noir',   i: 2, name: 'Keemun',                  origin: 'Qimen, Anhui, Chine',       c: 'China', p: 'Anhui', lat: 29.87, lon: 117.72 },
  { f: 'noir',   i: 3, name: 'Uva',                     origin: 'Uva, Sri Lanka',     c: 'Sri Lanka', lat: 6.88,  lon: 81.05 },
  { f: 'sombre', i: 0, name: "Pu'er shou",              origin: 'Yunnan, Chine',             c: 'China', p: 'Yunnan', lat: 22.78, lon: 100.97 },
  { f: 'sombre', i: 1, name: 'Liu Bao',                 origin: 'Wuzhou, Guangxi, Chine',    c: 'China', p: 'Guangxi', lat: 23.48, lon: 111.28 },
  { f: 'sombre', i: 2, name: 'Fu Zhuan',                origin: 'Anhua, Hunan, Chine',       c: 'China', p: 'Hunan', lat: 28.38, lon: 111.22 }
];

// Small boxes, wound so d3's spherical path reads them as the inside, not the complement.
const box = (w, s, e, n) => ({ type: 'Polygon', coordinates: [[[w, s], [w, n], [e, n], [e, s], [w, s]]] });

const REGIONS = [
  { id: 'asie',   label: 'Asie',            geo: box(62, -2, 152, 47), zoom: false },
  { id: 'est',    label: 'Asie de l\u2019Est', geo: box(98, 18, 146, 46), zoom: true },
  { id: 'sud',    label: 'Asie du Sud',     geo: box(68, 5, 94, 32),   zoom: true },
  { id: 'monde',  label: 'Monde',           geo: box(-170, -56, 178, 76), zoom: false }
];

const COUNTRIES_FR = { 'China': 'Chine', 'Japan': 'Japon', 'India': 'Inde', 'Sri Lanka': 'Sri Lanka', 'Taiwan': 'Taïwan', 'Kenya': 'Kenya' };
const TEA_COUNTRIES = ['China', 'Japan', 'India', 'Sri Lanka', 'Taiwan', 'Kenya'];

const LORE = {
  'Asie': "Tout part d'ici : le théier vient des confins du Yunnan, de la Birmanie et de l'Assam, et c'est le long de ces reliefs que les six familles se sont différenciées. Zoomez sur une région ou un pays pour lire son histoire — ce texte est à réécrire avec vos mots.",
  'Asie de l’Est': "Chine, Japon, Taïwan : le berceau des gestes. Wok pour fixer le vert en Chine, vapeur au Japon, torréfactions longues à Taïwan — trois écoles issues d'une même feuille. Paragraphe à compléter.",
  'Asie du Sud': "Inde et Sri Lanka : des jardins nés au XIXᵉ siècle, pensés pour de grands volumes et des thés noirs de caractère, de l'Assam humide aux crêtes fraîches de Darjeeling. Paragraphe à compléter.",
  'Monde': "Le thé a quitté l'Asie tard : Afrique de l'Est, Turquie, Géorgie, Amérique du Sud produisent aujourd'hui, mais les terroirs historiques restent concentrés sur cette bande asiatique. Paragraphe à compléter.",
  'Chine': "Le pays où tout commence, et le seul à produire les six familles. Chaque province a sa signature : Fujian pour les blancs et les oolongs, Zhejiang pour le Long Jing, Yunnan pour les thés sombres. Paragraphe à compléter.",
  'Japon': "Presque uniquement du vert, étuvé à la vapeur plutôt que chauffé au wok, et un goût marqué pour l'ombrage des jardins — Uji, Shizuoka, Kagoshima. Paragraphe à compléter.",
  'Inde': "Deux mondes : la plaine chaude de l'Assam, malté et puissant, et les pentes de Darjeeling, fines et muscatées, récoltées par vagues successives. Paragraphe à compléter.",
  'Sri Lanka': "Ceylan, organisé par altitudes — low, mid et high grown — dont Uva, célèbre pour le vent sec qui concentre ses arômes. Paragraphe à compléter.",
  'Taïwan': "L'île des oolongs de montagne : Dong Ding, Alishan, Shan Lin Xi, entre roulage serré et torréfactions douces. Paragraphe à compléter."
};

const PROV_LORE = {
  'Fujian': "La province la plus prolifique : les blancs de Fuding et Zhenghe, les oolongs d'Anxi et les rochers des monts Wuyi. Paragraphe à compléter.",
  'Zhejiang': "Hangzhou et le lac de l'Ouest, patrie du Long Jing, thé vert pressé à plat dans le wok. Paragraphe à compléter.",
  'Yunnan': "Vieilles forêts de théiers, feuilles larges, et la fermentation qui donne le pu'er. Paragraphe à compléter.",
  'Hunan': "Thés jaunes du lac Dongting et briques fermentées d'Anhua. Paragraphe à compléter.",
  'Anhui': "Keemun et Huoshan Huang Ya : des montagnes humides, des thés fins. Paragraphe à compléter.",
  'Sichuan': "Meng Ding, l'un des plus anciens jardins documentés de Chine. Paragraphe à compléter.",
  'Guangxi': "Wuzhou et le Liu Bao, thé sombre vieilli en paniers de bambou. Paragraphe à compléter.",
  'Taiwan': "Oolongs de haute montagne, héritiers des techniques du Fujian. Paragraphe à compléter.",
  'Shizuoka': "Première région productrice du Japon : sencha à perte de vue au pied du Fuji. Paragraphe à compléter.",
  'Guizhou': "Plateaux brumeux, verts de montagne comme le Duyun Mao Jian. Paragraphe \u00e0 compl\u00e9ter.",
  'Jiangxi': "Lu Shan Yun Wu et les th\u00e9s des monts Lu. Paragraphe \u00e0 compl\u00e9ter.",
  'Hubei': "Briques de th\u00e9 sombre et verts d'Enshi. Paragraphe \u00e0 compl\u00e9ter.",
  'Guangdong': "Phoenix Dan Cong, les oolongs parfum\u00e9s de Chaozhou. Paragraphe \u00e0 compl\u00e9ter.",
  'Jiangsu': "Bi Luo Chun du lac Tai. Paragraphe \u00e0 compl\u00e9ter.",
  'Henan': "Xinyang Mao Jian, le vert le plus septentrional des grands crus. Paragraphe \u00e0 compl\u00e9ter.",
  'Kagoshima': "Deuxi\u00e8me r\u00e9gion du Japon, r\u00e9coltes pr\u00e9coces au climat doux. Paragraphe \u00e0 compl\u00e9ter.",
  'Mie': "Kabusecha et sencha d'Ise. Paragraphe \u00e0 compl\u00e9ter.",
  'Miyazaki': "Kamairicha, vert japonais chauff\u00e9 au po\u00eale. Paragraphe \u00e0 compl\u00e9ter.",
  'Fukuoka': "Yame, gyokuro de grande r\u00e9putation. Paragraphe \u00e0 compl\u00e9ter.",
  'Saitama': "Sayama, le th\u00e9 le plus au nord du Japon. Paragraphe \u00e0 compl\u00e9ter.",
  'Nara': "Yamato-cha, l'un des berceaux du th\u00e9 japonais. Paragraphe \u00e0 compl\u00e9ter.",
  'Kyoto': "Uji, berceau du gyokuro et du matcha, jardins ombrés depuis le XIIᵉ siècle. Paragraphe à compléter."
};

// Provinces de thé affichées sur la carte (les autres ne sont pas tracées).
const TEA_PROVINCES = {
  China: ['Fujian', 'Zhejiang', 'Yunnan', 'Hunan', 'Anhui', 'Sichuan', 'Guangxi', 'Guizhou', 'Jiangxi', 'Hubei', 'Guangdong', 'Jiangsu', 'Henan'],
  Japan: ['Shizuoka', 'Kagoshima', 'Kyoto', 'Mie', 'Miyazaki', 'Fukuoka', 'Saitama', 'Nara']
};
const PROV_FR = { 'Kyoto': 'Kyoto (Uji)' };

const W = 1140, H = 640, PAD = 44;
const tip = document.getElementById('tip');

// Reprend les thés depuis le tableur (contenu.xlsx, feuille « Thes », sinon thes.csv).
const PAYS_EN = { 'chine': 'China', 'japon': 'Japan', 'inde': 'India', 'sri lanka': 'Sri Lanka', 'taiwan': 'Taiwan', 'taïwan': 'Taiwan', 'kenya': 'Kenya', 'afrique du sud': 'South Africa', 'argentine': 'Argentina', 'brésil': 'Brazil', 'paraguay': 'Paraguay' };
async function loadSheetTeas() {
  if (!window.XLSX) return;
  const readCsv = (X, txt) => X.read(txt, { type: 'string', FS: (txt.split('\n')[0].split(';').length > txt.split('\n')[0].split(',').length) ? ';' : ',', raw: true });
  const X = window.XLSX;
  let rows = [];
  try { const r = await fetch('contenu.xlsx');
    if (r.ok) { const wb = X.read(await r.arrayBuffer());
      const n = wb.SheetNames.find(s => /th/i.test(s)) || wb.SheetNames[0];
      rows = X.utils.sheet_to_json(wb.Sheets[n], { defval: '' }); } } catch (e) {}
  if (!rows.length) {
    try { const r = await fetch('thes.csv');
      if (r.ok) rows = X.utils.sheet_to_json(readCsv(X, await r.text()).Sheets.Sheet1, { defval: '' }); } catch (e) {}
  }
  const key = s => String(s || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/^the\s+/, '').replace(/\s*\(.*\)$/, '');
  const out = [], count = {};
  rows.forEach(r => {
    const f = key(r.famille), lat = parseFloat(r.lat), lon = parseFloat(r.lon);
    if (!FAMILIES[f] || isNaN(lat) || isNaN(lon)) return;
    count[f] = (count[f] || 0);
    out.push({ f: f, i: count[f]++, name: r.nom, origin: [r.origine, r.pays].filter(Boolean).join(', '),
               c: PAYS_EN[String(r.pays || '').trim().toLowerCase()] || r.pays, p: r.province || undefined, lat: lat, lon: lon });
  });
  if (out.length) { TEAS.length = 0; out.forEach(t => TEAS.push(t)); }
}

// ---- Carte par régions : une zone = une province (Chine, Japon) ou un pays ----
const CENTER_FIX = { 'Taiwan': [121, 23.7], 'Sri Lanka': [80.7, 7.6], 'Kenya': [37.5, 0.2], 'India': [80, 22] };
const ASIA = box(62, -2, 152, 47);

Promise.all([
  d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json'),
  d3.json('https://cdn.jsdelivr.net/npm/cn-atlas/cn-atlas.json').catch(() => null),
  d3.json('https://cdn.jsdelivr.net/gh/dataofjapan/land@master/japan.topojson').catch(() => null),
  loadSheetTeas()
]).then(([topology, cn, jp]) => {
  const countries = topojson.feature(topology, topology.objects.countries).features;
  const byName = {}; countries.forEach(f => { byName[f.properties.name] = f; });

  // Provinces chinoises et préfectures japonaises qui produisent du thé
  const provs = [];
  const extra = cc => TEAS.filter(t => t.c === cc && t.p).map(t => t.p);
  if (cn) topojson.feature(cn, cn.objects.provinces).features.forEach(f => {
    const n = String(f.properties.name || '').replace(/ (Province|Sheng)$/i, '');
    const hit = TEA_PROVINCES.China.concat(extra('China')).find(p => n.indexOf(p) === 0);
    if (hit) provs.push({ id: 'cn-' + hit, name: hit, country: 'China', geo: f });
  });
  if (jp) topojson.feature(jp, jp.objects.japan).features.forEach(f => {
    const n = String(f.properties.nam || '').replace(/ (Ken|Fu|To|Do)$/, '');
    if (TEA_PROVINCES.Japan.concat(extra('Japan')).indexOf(n) >= 0) provs.push({ id: 'jp-' + n, name: PROV_FR[n] || n, key: n, country: 'Japan', geo: f });
  });

  // Une « zone » par province, plus un pays entier là où on n'a pas de découpage
  const zones = provs.slice();
  TEA_COUNTRIES.forEach(c => { if (!zones.some(z => z.country === c) && byName[c]) zones.push({ id: 'c-' + c, name: COUNTRIES_FR[c] || c, country: c, geo: byName[c], whole: true }); });
  const zoneOf = t => {
    if (t.p) { const z = zones.find(z => !z.whole && z.country === t.c && String(z.key || z.name).indexOf(t.p) === 0); if (z) return z; }
    return zones.find(z => z.whole && z.country === t.c) || null;
  };
  zones.forEach(z => { z.teas = []; });
  TEAS.forEach(t => { const z = zoneOf(t); if (z) z.teas.push(t); });
  const famOrder = Object.keys(FAMILIES);
  zones.forEach(z => {
    z.fams = famOrder.filter(f => z.teas.some(t => t.f === f));
    const c = {}; z.teas.forEach(t => { c[t.f] = (c[t.f] || 0) + 1; });
    z.main = z.fams.slice().sort((a, b) => c[b] - c[a])[0] || null;
  });
  const live = zones.filter(z => z.teas.length);

  const svg = d3.select('#map').append('svg').attr('viewBox', '0 0 ' + W + ' ' + H).attr('role', 'img').attr('aria-label', 'Carte des régions productrices de thé');
  svg.append('rect').attr('width', W).attr('height', H).attr('fill', css('--color-surface'));
  const projection = d3.geoMercator().fitExtent([[PAD, PAD], [W - PAD, H - PAD]], ASIA);
  const path = d3.geoPath(projection);
  const root = svg.append('g');
  const gLand = root.append('g'), gZones = root.append('g'), gMarks = root.append('g');

  let filter = null, selected = null, k = 1;
  const mix = (c, pct) => 'color-mix(in srgb, ' + c + ' ' + pct + '%, ' + css('--color-surface') + ')';
  const zoneFill = z => {
    if (!z.main) return css('--color-neutral-200');
    if (filter && z.fams.indexOf(filter) < 0) return css('--color-neutral-200');
    const f = filter || z.main;
    const col = f === 'blanc' ? css('--color-neutral-400') : FAMILIES[f].color;
    return mix(col, selected === z ? 95 : 62);
  };

  gLand.selectAll('path').data(countries).join('path').attr('d', path)
    .attr('fill', f => TEA_COUNTRIES.indexOf(f.properties.name) >= 0 ? css('--color-neutral-300') : css('--color-neutral-200'))
    .attr('stroke', css('--color-neutral-400')).attr('stroke-width', 0.6).attr('vector-effect', 'non-scaling-stroke');

  const showTip = (e, html) => { tip.innerHTML = html; tip.style.opacity = 1; tip.style.left = Math.min(e.clientX + 16, window.innerWidth - 260) + 'px'; tip.style.top = (e.clientY + 16) + 'px'; };
  const famBadges = z => z.fams.map(f => '<span style="display:inline-flex;align-items:center;gap:5px;margin-right:8px"><i style="width:9px;height:9px;border-radius:50%;background:' + FAMILIES[f].color + ';display:inline-block;border:1px solid rgba(255,255,255,.4)"></i>' + FAMILIES[f].label.replace(/ \(.*\)/, '') + '</span>').join('');

  const zp = gZones.selectAll('path').data(live).join('path').attr('d', z => path(z.geo))
    .attr('stroke', css('--color-bg')).attr('stroke-width', 1.2).attr('vector-effect', 'non-scaling-stroke')
    .style('cursor', 'pointer')
    .on('mousemove', function (e, z) { const f = filter || z.main; d3.select(this).attr('fill', mix(f === 'blanc' ? css('--color-neutral-500') : FAMILIES[f].color, 90)); showTip(e, '<b>' + z.name + '</b>' + famBadges(z) + '<br><span style="opacity:.7">' + z.teas.length + (z.teas.length > 1 ? ' thés' : ' thé') + ' · cliquer pour le détail</span>'); })
    .on('mouseleave', function (e, z) { d3.select(this).attr('fill', zoneFill(z)); tip.style.opacity = 0; })
    .on('click', (e, z) => { e.stopPropagation(); select(z, true); });

  // Repère par zone : petites pastilles des familles + nom (le nom apparaît en zoomant)
  const center = z => projection(CENTER_FIX[z.country] && z.whole ? CENTER_FIX[z.country] : d3.geoCentroid(z.geo));
  const mk = gMarks.selectAll('g').data(live).join('g').style('pointer-events', 'none');
  mk.selectAll('circle').data(z => z.fams.map((f, i) => ({ f: f, i: i, n: z.fams.length }))).join('circle')
    .attr('fill', d => FAMILIES[d.f].color).attr('stroke', css('--color-bg')).attr('stroke-width', 1.5).attr('vector-effect', 'non-scaling-stroke');
  mk.append('text').attr('class', 'zl').text(z => z.name)
    .attr('font-family', 'Figtree, system-ui, sans-serif').attr('text-anchor', 'middle')
    .attr('paint-order', 'stroke').attr('stroke', css('--color-bg')).attr('fill', css('--color-neutral-900'));

  function layoutMarks() {
    const r = 5 / Math.sqrt(k), gap = r * 2.3;
    mk.attr('transform', z => { const c = center(z); return 'translate(' + c[0] + ',' + c[1] + ')'; });
    mk.selectAll('circle').attr('r', r).attr('cx', d => (d.i - (d.n - 1) / 2) * gap).attr('cy', 0)
      .attr('opacity', d => !filter || d.f === filter ? 1 : 0.25);
    mk.select('text').attr('font-size', 12 / k).attr('stroke-width', 3 / k).attr('y', -r - 5 / k)
      .attr('opacity', z => (k >= 2.2 || selected === z) ? 1 : 0);
  }
  function paint() { zp.attr('fill', zoneFill); layoutMarks(); }

  const zoom = d3.zoom().scaleExtent([1, 14]).translateExtent([[-W * 0.5, -H * 0.5], [W * 1.5, H * 1.5]])
    .on('zoom', e => { root.attr('transform', e.transform); k = e.transform.k; layoutMarks(); tip.style.opacity = 0; });
  svg.call(zoom).on('dblclick.zoom', null);
  svg.on('click', () => { if (selected) { selected = null; paint(); drawPanel(null); } });

  function zoomTo(geo) {
    const [[x0, y0], [x1, y1]] = path.bounds(geo);
    const s = Math.min(8, 0.8 / Math.max((x1 - x0) / W, (y1 - y0) / H));
    svg.transition().duration(700).call(zoom.transform, d3.zoomIdentity.translate(W / 2, H / 2).scale(s).translate(-(x0 + x1) / 2, -(y0 + y1) / 2));
  }
  function select(z, fly) { selected = z; paint(); drawPanel(z); if (fly) zoomTo(z.geo); }

  // Panneau de détail
  function drawPanel(z) {
    const el = document.getElementById('lore');
    if (!z) {
      el.innerHTML = '<h2 style="font-size: 26px; margin: 0;">Choisissez une région</h2>'
        + '<p style="font-size: 16px; line-height: 1.7; opacity: .8; margin: 0;">' + LORE['Asie'] + '</p>'
        + '<p style="font-size: 14px; opacity: .65; margin: 0;">' + live.length + ' régions productrices · ' + TEAS.length + ' thés au catalogue.</p>';
      return;
    }
    const text = PROV_LORE[z.key || z.name] || PROV_LORE[z.name] || LORE[z.name] || '';
    let html = '<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap"><h2 style="font-size: 30px; margin: 0;">' + z.name + '</h2>'
      + (z.whole ? '' : '<span style="font-size:14px;opacity:.65">' + (COUNTRIES_FR[z.country] || z.country) + '</span>') + '</div>';
    if (text) html += '<p style="font-size: 16px; line-height: 1.7; opacity: .85; margin: 0; text-wrap: pretty;">' + text + '</p>';
    z.fams.forEach(f => {
      const ts = z.teas.filter(t => t.f === f);
      html += '<div style="display:flex;flex-direction:column;gap:8px;margin-top:4px"><div style="display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.75"><i style="width:12px;height:12px;border-radius:50%;background:' + FAMILIES[f].color + ';border:1px solid var(--color-divider);display:inline-block"></i>' + FAMILIES[f].label.replace(/ \(.*\)/, '') + ' · ' + ts.length + '</div>'
        + '<div style="display:flex;flex-wrap:wrap;gap:8px">' + ts.map(t => '<a class="chip" style="text-decoration:none" href="Site%20The.dc.html#the=' + t.f + '-' + t.i + '">' + t.name + ' →</a>').join('') + '</div></div>';
    });
    el.innerHTML = html;
  }

  // Légende = filtre par famille
  const leg = document.getElementById('legend');
  famOrder.forEach(f => {
    const b = document.createElement('button');
    b.className = 'chip'; b.setAttribute('aria-pressed', 'false');
    b.innerHTML = '<i style="width:12px;height:12px;border-radius:50%;background:' + FAMILIES[f].color + ';border:1px solid var(--color-divider);display:inline-block;margin-right:8px;vertical-align:-1px"></i>' + FAMILIES[f].label.replace(/ \(.*\)/, '');
    b.onclick = () => { filter = filter === f ? null : f; leg.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', 'false')); if (filter) b.setAttribute('aria-pressed', 'true'); paint(); };
    leg.appendChild(b);
  });
  document.getElementById('zin').onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1.6);
  document.getElementById('zout').onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1 / 1.6);
  document.getElementById('zreset').onclick = () => { selected = null; paint(); drawPanel(null); svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity); };

  paint(); drawPanel(null);
});
</script>
</body>
</html>
