# Sauvegarde chiffrée de la base Supabase, chaque nuit.
# À configurer une fois dans GitHub → Settings → Secrets and variables → Actions :
#   SUPABASE_SERVICE_KEY : la clé secrète Supabase (sb_secret_…, après rotation) — jamais dans le code
#   BACKUP_PASSPHRASE    : une longue phrase de passe, gardée aussi ailleurs (gestionnaire de mots de passe)
# La sauvegarde est un « artifact » chiffré (AES-256) gardé 30 jours, dans l'onglet Actions.
# Pour la lire : gpg --decrypt maison-du-the-AAAA-MM-JJ.json.gz.gpg | gunzip > sauvegarde.json
name: Sauvegarde nocturne
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Export et chiffrement
        env:
          URL: https://hnyomaobuftunuhwkzox.supabase.co
          KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${KEY}" ] || [ -z "${PASS}" ]; then echo "Secrets absents : sauvegarde ignorée."; exit 0; fi
          get() { # table, tri, fichier : toutes les lignes, par pages de 1000
            local t="$1" from=0; echo "[]" > "$3"
            while :; do
              curl -sSf "${URL}/rest/v1/${t}?select=*&order=${2}&offset=${from}&limit=1000" -H "apikey: ${KEY}" -o page.json || { echo "Table ${t} illisible"; break; }
              jq -s '.[0] + .[1]' "$3" page.json > tmp.json && mv tmp.json "$3"
              [ "$(jq length page.json)" -lt 1000 ] && break
              from=$((from+1000))
            done
            rm -f page.json
          }
          D=$(date -u +%F)
          get mdt_items kind,id items.json
          get maison_members nom members.json
          get the_data id v1.json
          jq -n --arg at "$(date -u +%FT%TZ)" --slurpfile items items.json --slurpfile members members.json --slurpfile v1 v1.json \
            '{format:"maison-du-the-backup", at:$at, mdt_items:$items[0], maison_members:$members[0], the_data:$v1[0]}' \
            | gzip -9 > backup.json.gz
          rm -f items.json members.json v1.json
          echo "Taille : $(stat -c %s backup.json.gz) octets"
          gpg --batch --yes --pinentry-mode loopback --passphrase "${PASS}" --symmetric --cipher-algo AES256 -o "maison-du-the-${D}.json.gz.gpg" backup.json.gz
          rm backup.json.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sauvegarde
          path: maison-du-the-*.json.gz.gpg
          retention-days: 30
          if-no-files-found: ignore
